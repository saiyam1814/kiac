<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="100%" stop-color="#121A33"/>
    </linearGradient>
    <linearGradient id="hexgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5AC8FA"/>
      <stop offset="100%" stop-color="#0A84FF"/>
    </linearGradient>
    <linearGradient id="termbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161B2E"/>
      <stop offset="100%" stop-color="#10152A"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- faint decorative hexagons -->
  <g fill="none" stroke="#2A3554" stroke-width="2" opacity="0.35">
    <polygon points="1080,40 1130,68 1130,124 1080,152 1030,124 1030,68"/>
    <polygon points="1140,150 1180,172 1180,218 1140,240 1100,218 1100,172"/>
    <polygon points="60,560 100,582 100,628 60,650 20,628 20,582"/>
  </g>

  <!-- left column -->
  <!-- logo hexagon -->
  <polygon points="105,52 138,71 138,109 105,128 72,109 72,71" fill="url(#hexgrad)"/>
  <polygon points="105,66 126,78 126,102 105,114 84,102 84,78" fill="#0B1020"/>
  <polygon points="105,76 117,83 117,97 105,104 93,97 93,83" fill="url(#hexgrad)"/>

  <text x="160" y="112" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#FFFFFF">kiac</text>

  <text x="72" y="178" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#9BA3B5">Kubernetes in Apple Containers</text>

  <!-- tagline -->
  <text x="72" y="248" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Every node is its own</text>
  <text x="72" y="292" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#5AC8FA">lightweight VM.</text>

  <!-- feature checks -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#D7DCE8">
    <text x="72" y="352"><tspan fill="#32D74B" font-weight="700">✓</tspan>  kubectl top works out of the box</text>
    <text x="72" y="392"><tspan fill="#32D74B" font-weight="700">✓</tspan>  LoadBalancer gets a real EXTERNAL-IP</text>
    <text x="72" y="432"><tspan fill="#32D74B" font-weight="700">✓</tspan>  PVCs just bind, StatefulSets just work</text>
    <text x="72" y="472"><tspan fill="#32D74B" font-weight="700">✓</tspan>  No Docker Desktop · No Lima · No QEMU</text>
  </g>

  <!-- install pill -->
  <rect x="72" y="510" width="448" height="58" rx="12" fill="#0D1426" stroke="#2A3554" stroke-width="1.5"/>
  <text x="94" y="547" font-family="Menlo, Monaco, Courier New, monospace" font-size="16" fill="#32D74B">brew install --cask saiyam1814/tap/kiac</text>

  <text x="72" y="618" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#6B7287">Open source · MIT · Apple silicon</text>

  <!-- terminal window -->
  <rect x="568" y="64" width="566" height="548" rx="14" fill="url(#termbg)" stroke="#2A3554" stroke-width="1.5"/>
  <!-- title bar -->
  <rect x="568" y="64" width="566" height="44" rx="14" fill="#1B2138"/>
  <rect x="568" y="86" width="566" height="22" fill="#1B2138"/>
  <circle cx="596" cy="86" r="7" fill="#FF5F57"/>
  <circle cx="620" cy="86" r="7" fill="#FEBC2E"/>
  <circle cx="644" cy="86" r="7" fill="#28C840"/>
  <text x="851" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#6B7287" text-anchor="middle">zsh — kiac</text>

  <!-- terminal content -->
  <g font-family="Menlo, Monaco, Courier New, monospace" font-size="17">
    <text x="596" y="146" fill="#E8ECF5"><tspan fill="#5AC8FA">$</tspan> kiac create cluster --name dev --workers 2</text>

    <text x="596" y="182" fill="#9BA3B5"><tspan fill="#32D74B">✓</tspan> Preflight checks <tspan fill="#566080">(0.3s)</tspan></text>
    <text x="596" y="212" fill="#9BA3B5"><tspan fill="#32D74B">✓</tspan> Booting 3 node VM(s) <tspan fill="#566080">(9.8s)</tspan></text>
    <text x="596" y="242" fill="#9BA3B5"><tspan fill="#32D74B">✓</tspan> Initializing control plane <tspan fill="#566080">(32.1s)</tspan></text>
    <text x="596" y="272" fill="#9BA3B5"><tspan fill="#32D74B">✓</tspan> Joining 2 worker(s) <tspan fill="#566080">(18.4s)</tspan></text>
    <text x="596" y="302" fill="#9BA3B5"><tspan fill="#32D74B">✓</tspan> CNI · storage · metrics-server</text>
    <text x="596" y="332" fill="#9BA3B5"><tspan fill="#32D74B">✓</tspan> LoadBalancer (kiac-lb) <tspan fill="#566080">(1.1s)</tspan></text>

    <text x="596" y="376" fill="#FFFFFF">Cluster <tspan fill="#FEBC2E">"dev"</tspan> is ready in <tspan fill="#32D74B" font-weight="700">81s</tspan>.</text>

    <text x="596" y="420" fill="#E8ECF5"><tspan fill="#5AC8FA">$</tspan> kubectl get nodes</text>
    <text x="596" y="452" fill="#6B7287">NAME<tspan x="810">STATUS</tspan><tspan x="920">ROLES</tspan></text>
    <text x="596" y="482" fill="#D7DCE8">dev-control-plane<tspan x="810" fill="#32D74B">Ready</tspan><tspan x="920">control-plane</tspan></text>
    <text x="596" y="512" fill="#D7DCE8">dev-worker<tspan x="810" fill="#32D74B">Ready</tspan><tspan x="920">worker</tspan></text>
    <text x="596" y="542" fill="#D7DCE8">dev-worker2<tspan x="810" fill="#32D74B">Ready</tspan><tspan x="920">worker</tspan></text>

    <text x="596" y="586" fill="#E8ECF5"><tspan fill="#5AC8FA">$</tspan> <tspan fill="#566080">▊</tspan></text>
  </g>
</svg>
