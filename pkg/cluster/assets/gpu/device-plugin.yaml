apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kiac-gpu-device-plugin
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kiac-gpu-device-plugin
    app.kubernetes.io/part-of: kiac
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kiac-gpu-device-plugin
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kiac-gpu-device-plugin
        app.kubernetes.io/part-of: kiac
    spec:
      priorityClassName: system-node-critical
      nodeSelector:
        kiac.dev/gpu.present: "true"
      tolerations:
        - key: kiac.dev/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: device-plugin
          image: ghcr.io/squat/generic-device-plugin@sha256:66c8d5c270eb2b721f1064c549b9b7898152a6d2f0163380a5d37dc7636c20ff
          imagePullPolicy: IfNotPresent
          args:
            - --domain=kiac.dev
            - --device
            - '{"name":"gpu","groups":[{"count":1,"paths":[{"path":"/dev/dri/renderD128"},{"path":"/dev/dri/card0","optional":true}]}]}'
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              memory: 96Mi
          volumeMounts:
            - name: device-plugins
              mountPath: /var/lib/kubelet/device-plugins
            - name: dev
              mountPath: /dev
      volumes:
        - name: device-plugins
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory
        - name: dev
          hostPath:
            path: /dev
            type: Directory
