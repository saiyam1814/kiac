apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kiac-gpu-device-plugin
  namespace: kiac-gpu-system
  labels:
    app.kubernetes.io/name: kiac-gpu-device-plugin
    app.kubernetes.io/part-of: kiac
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kiac-gpu-device-plugin
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kiac-gpu-device-plugin
        app.kubernetes.io/part-of: kiac
    spec:
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      containers:
        - name: generic-device-plugin
          image: docker.io/squat/generic-device-plugin:0.2.0@sha256:66c8d5c270eb2b721f1064c549b9b7898152a6d2f0163380a5d37dc7636c20ff
          imagePullPolicy: IfNotPresent
          args:
            - --domain=kiac.dev
            - --device
            - |-
              name: gpu
              groups:
                - count: 1
                  paths:
                    - path: /dev/null
                      mountPath: /dev/kiac-mock-gpu
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: device-plugins
              mountPath: /var/lib/kubelet/device-plugins
      volumes:
        - name: device-plugins
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory
