apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kiac-gpu-device-plugin
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kiac-gpu-device-plugin
    app.kubernetes.io/part-of: kiac
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kiac-gpu-device-plugin
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kiac-gpu-device-plugin
        app.kubernetes.io/part-of: kiac
    spec:
      priorityClassName: system-node-critical
      nodeSelector:
        kiac.dev/gpu.present: "true"
      tolerations:
        - key: kiac.dev/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      automountServiceAccountToken: false
      containers:
        - name: device-plugin
          image: docker.io/library/busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
          imagePullPolicy: IfNotPresent
          command: [/opt/kiac/kiac-gpu-agent]
          args: [--mode=device-plugin]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          securityContext:
            privileged: true
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            exec:
              command: [/opt/kiac/kiac-gpu-agent, --mode=health-check]
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 1
          volumeMounts:
            - name: agent
              mountPath: /opt/kiac/kiac-gpu-agent
              readOnly: true
            - name: health
              mountPath: /run/kiac-gpu-health
              readOnly: true
            - name: device-plugins
              mountPath: /var/lib/kubelet/device-plugins
            - name: dri
              mountPath: /dev/dri
        - name: health-probe
          image: quay.io/slopezpa/fedora-vgpu-llama@sha256:f58a677fd617e5a6d0b7f558fd137d63a57aaac70293956ef09a16ec69e210d4
          imagePullPolicy: IfNotPresent
          command: [/opt/kiac/kiac-gpu-agent]
          args: [--mode=health-watchdog, --probe-binary=/opt/kiac/kiac-vulkan-probe]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: MESA_SHADER_CACHE_DISABLE
              value: "true"
            - name: HOME
              value: /tmp
          securityContext:
            privileged: true
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: native-probe
              mountPath: /opt/kiac/kiac-vulkan-probe
              readOnly: true
            - name: agent
              mountPath: /opt/kiac/kiac-gpu-agent
              readOnly: true
            - name: dri
              mountPath: /dev/dri
            - name: health
              mountPath: /run/kiac-gpu-health
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: native-probe
          hostPath:
            path: /usr/local/libexec/kiac/kiac-vulkan-probe
            type: File
        - name: health
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: agent
          hostPath:
            path: /usr/local/libexec/kiac/kiac-gpu-agent
            type: File
        - name: device-plugins
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
