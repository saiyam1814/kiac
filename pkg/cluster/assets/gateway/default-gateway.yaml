# Default GatewayClass and Gateway so an HTTPRoute with
# parentRefs [{name: kiac, namespace: kiac-gateway}] works with zero
# extra setup. Listeners accept routes from every namespace.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: traefik
spec:
  controllerName: traefik.io/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kiac
  namespace: kiac-gateway
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
