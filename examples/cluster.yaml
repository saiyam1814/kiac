# kiac cluster config, used with: kiac create cluster --config cluster.yaml
#
# Every key is optional. Precedence: a flag set explicitly on the
# command line overrides the value from this file; omitted keys keep
# the CLI defaults. For a fully spelled-out config with every knob
# and all addons on, see examples/cluster-full.yaml.

name: dev            # cluster name: lowercase letters, digits, dashes
workers: 2           # worker node count; 0 untaints the control plane
k8sVersion: "1.37"   # default for both distros
# image: docker.io/kindest/node:v1.37.0   # node image, overrides k8sVersion
cni: kindnet         # pod network: kindnet, cilium or flannel (both need --kernel full
                     # on the command line), or none to bring your own
ipFamily: ipv4       # ipv4 (default), dual (IPv4-primary + IPv6), or ipv6 (IPv6-primary).
                     # dual/ipv6 auto-select the full kernel (IPv6 netfilter) and need macOS 26+.
# dns: [1.1.1.1, 8.8.8.8]  # node VM nameservers, up to 3; replaces the
                     # runtime default resolv.conf entirely when set
# mounts:             # host directories mounted into every node VM
#   - source: /Users/me/project
#     target: /workspace
#     readOnly: true
# Omitted host IP binds all IPv4 interfaces; use 127.0.0.1 for loopback.
# Publishing 6443 does not add API-server TLS SANs.
# publish:            # optional host->VM forwards on the control-plane VM only
#   - 127.0.0.1:8080:80
#   - '[::1]:8443:443/udp'
# k3sControlplaneArgs:      # optional extra k3s "server" argv tokens (k3s distro only)
#                     # minimally validated; conflicting values can break the cluster
#   - --tls-san
#   - api.dev.test
# k3sWorkerArgs:       # optional extra k3s "agent" argv tokens (k3s distro only)
#                     # minimally validated; conflicting values can break the cluster
#   - --kubelet-arg=protect-kernel-defaults=true
cpus: "4"            # vCPUs per node VM (quote it: YAML reads bare 4 as a number)
memory: 4G           # memory per node VM
wait: 5m             # timeout for nodes to become Ready

# Addons are positive toggles; omitted keys keep the defaults shown.
addons:
  metrics: true          # metrics-server (kubectl top nodes/pods)
  storage: true          # local-path default StorageClass
  loadBalancer: true     # kiac-lb, Services of type LoadBalancer
  edgeProxy: true        # node-local TCP proxy for large external uploads
  observability: false   # Prometheus + Grafana + node-exporter
  gateway: false         # Gateway API CRDs + Traefik
