apiVersion: v1
kind: Namespace
metadata:
  name: kiac-e2e
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: upload-server
  namespace: kiac-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app: upload-server
  template:
    metadata:
      labels:
        app: upload-server
    spec:
      containers:
        - name: server
          image: docker.io/library/busybox:1.37.0
          command: [sh, -c, "sleep 86400"]
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: upload-server
  namespace: kiac-e2e
spec:
  type: LoadBalancer
  # Dual-stack where the cluster is: the dual profiles upload over the node's
  # IPv6 address, and a SingleStack (IPv4) Service has no IPv6 EndpointSlice,
  # so neither kube-proxy nor the edge proxy can route that NodePort. On a
  # single-stack cluster this degrades to one family.
  ipFamilyPolicy: PreferDualStack
  selector:
    app: upload-server
  ports:
    - name: http
      port: 8080
      targetPort: http
