apiVersion: v1
kind: Pod
metadata:
  name: kiac-gpu-compat
  namespace: kiac-gpu-compat-e2e
  labels:
    app.kubernetes.io/name: kiac-gpu-compat-e2e
spec:
  restartPolicy: Never
  runtimeClassName: nvidia
  nodeSelector:
    kiac.dev/gpu.present: "true"
  containers:
    - name: probe
      image: quay.io/slopezpa/fedora-vgpu@sha256:d1fd35583d1c72bc7380bb977d5d51e70d70c77a2279a0412c2e6ac462f61f16
      imagePullPolicy: IfNotPresent
      command: [/bin/bash, -euo, pipefail, -c]
      args:
        - vulkaninfo --summary 2>&1 | tee /tmp/vulkaninfo; grep -q 'deviceName.*Virtio-GPU Venus' /tmp/vulkaninfo
      env:
        - name: XDG_RUNTIME_DIR
          value: /tmp
      resources:
        requests:
          nvidia.com/gpu: "1"
        limits:
          nvidia.com/gpu: "1"
