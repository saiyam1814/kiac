apiVersion: v1
kind: Pod
metadata:
  name: hostpath
  namespace: kiac-e2e
spec:
  restartPolicy: Never
  containers:
    - name: hostpath
      image: docker.io/library/busybox:1.37.0
      command: [sh, -c, "sleep 86400"]
      volumeMounts:
        - name: host
          mountPath: /host
  volumes:
    - name: host
      hostPath:
        path: /kiac-e2e-host
        type: Directory
