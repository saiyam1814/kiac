version: 2

project_name: kiac

before:
  hooks:
    - make edge-proxy-asset gpu-agent-asset

builds:
  - main: .
    binary: kiac
    goos: [darwin]
    goarch: [arm64]
    env: [CGO_ENABLED=0]
    ldflags:
      - -s -w -X github.com/saiyam1814/kiac/cmd.Version=v{{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

homebrew_casks:
  - directory: Casks
    repository:
      owner: saiyam1814
      name: homebrew-tap
      branch: main
      git:
        url: git@github.com:saiyam1814/homebrew-tap.git
        private_key: "{{ .Env.HOMEBREW_TAP_DEPLOY_KEY_PATH }}"
    commit_author:
      name: kiac release bot
      email: 41898282+github-actions[bot]@users.noreply.github.com
    homepage: https://github.com/saiyam1814/kiac
    description: "Kubernetes in Apple Containers - every node is its own lightweight VM"
    license: MIT
    dependencies:
      - formula: kubernetes-cli
    # GoReleaser v2.17.1 only emits legacy flight hooks. Keep the declarative
    # stanza here until hooks.post.install_steps is available in a stable
    # release: https://github.com/goreleaser/goreleaser/pull/6873
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/kiac"]
        end
      end
    caveats: |
      kiac needs apple/container 1.0+ (skip 1.2.0; use 1.2.1 or newer):
        https://github.com/apple/container/releases
      Then: kiac doctor

release:
  github:
    owner: saiyam1814
    name: kiac
  draft: true
  use_existing_draft: true
  mode: keep-existing

changelog:
  use: github-native
