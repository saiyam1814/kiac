version: 2

project_name: kiac

before:
  hooks:
    - make edge-proxy-asset

builds:
  - main: .
    binary: kiac
    goos: [darwin]
    goarch: [arm64]
    env: [CGO_ENABLED=0]
    ldflags:
      - -s -w -X github.com/saiyam1814/kiac/cmd.Version=v{{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

homebrew_casks:
  - directory: Casks
    repository:
      owner: saiyam1814
      name: homebrew-tap
      branch: main
      git:
        url: git@github.com:saiyam1814/homebrew-tap.git
        private_key: "{{ .Env.HOMEBREW_TAP_DEPLOY_KEY_PATH }}"
    commit_author:
      name: kiac release bot
      email: 41898282+github-actions[bot]@users.noreply.github.com
    url:
      verified: github.com/saiyam1814/kiac/
    homepage: https://github.com/saiyam1814/kiac
    description: "Kubernetes in Apple Containers - every node is its own lightweight VM"
    license: MIT
    dependencies:
      - formula: kubernetes-cli
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/kiac"]
          end
    caveats: |
      kiac needs apple/container 1.0+ (skip 1.2.0; use 1.2.1 or newer):
        https://github.com/apple/container/releases
      Then: kiac doctor

release:
  github:
    owner: saiyam1814
    name: kiac
  draft: true

changelog:
  use: github-native
